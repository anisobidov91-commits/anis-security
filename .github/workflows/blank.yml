name: Build Anis Security APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: anis-security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          ls -la
          ls public

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Harden manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          grep -q 'usesCleartextTraffic' "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="false"/' "$M"
          grep -n 'allowBackup\|usesCleartextTraffic' "$M"

      - name: Build debug APK
        working-directory: anis-security/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Anis-Security-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Anis-Security-debug-apk
          path: anis-security/Anis-Security-debug.apk
